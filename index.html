<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Unbounded (titres) et Plus Jakarta Sans (texte) portent toute la vitrine publique depuis
         la refonte du 2026-10-09 ; Playfair Display sert au logo écrit. Inter, Poppins et Caveat
         restent pour la vitrine et la plateforme.
         Fraunces (2026-10-16) porte les titres des trois espaces connectés, souvent en italique :
         les maquettes de la refonte claire l'emploient pour chaque titre de page et de section, et
         pour les noms de personnes. Les axes variables `opsz`/`wght` sont demandés en italique ET
         en romain, les deux styles étant utilisés côte à côte. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&family=Caveat:wght@600;700&display=swap"
    />
    <!-- Ouvre la connexion TLS vers Supabase pendant le téléchargement du JS plutôt qu'après :
         chaque page, Hero comprise, interroge Supabase dès son premier rendu (session, profil). -->
    <link rel="preconnect" href="https://qnzjegdgdmhcwqpvtvvi.supabase.co" crossorigin />
    <!-- Démarre le téléchargement de l'illustration du Hero EN PARALLÈLE du JS, au lieu
         d'attendre que React ait fini de charger, s'exécuter et rendre le composant qui la
         référence — demande client du 2026-09-16, « le chargement doit être très rapide, 1 à 2
         secondes maximum ». Sans ce préchargement, l'image (~250 Ko) ne commençait à se
         télécharger qu'une fois tout le bundle JS téléchargé ET exécuté, les deux téléchargements
         s'enchaînant au lieu de se chevaucher. Présent sur toutes les pages (ce fichier est le
         même pour toute l'application) : un coût négligeable sur les autres pages une fois
         l'image en cache, pour un gain net sur celle qui compte le plus, la vitrine publique. -->
    <link rel="preload" as="image" href="/hero-illustration-3d.webp" fetchpriority="high" type="image/webp" />
    <!-- Ces deux balises sont celles de l'ACCUEIL. En production elles sont retirées puis
         réécrites page par page par le plugin `hoc-seo-pages-vitrine` (vite.config.ts), qui pose
         en plus l'adresse canonique, les balises de partage et les données structurées — source
         unique : src/lib/seoVitrine.ts. Elles restent ici pour le serveur de développement, qui
         ne passe pas par ce plugin, et comme repli si le build venait à ne pas les réécrire. -->
    <title>Cours d’anglais en ligne à Madagascar | Hari Online Club</title>
    <meta
      name="description"
      content="Découvrez Hari Online Club : des cours d’anglais en ligne individuels, en duo ou en groupe. Développez votre expression orale et gagnez en confiance grâce à un apprentissage axé sur la pratique."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
