<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&family=Caveat:wght@600;700&display=swap"
    />
    <!-- Ouvre la connexion TLS vers Supabase pendant le téléchargement du JS plutôt qu'après :
         chaque page, Hero comprise, interroge Supabase dès son premier rendu (session, profil). -->
    <link rel="preconnect" href="https://qnzjegdgdmhcwqpvtvvi.supabase.co" crossorigin />
    <!-- Démarre le téléchargement de l'image de fond du Hero EN PARALLÈLE du JS, au lieu
         d'attendre que React ait fini de charger, s'exécuter et rendre le composant qui la
         référence — demande client du 2026-09-16, « le chargement doit être très rapide, 1 à 2
         secondes maximum ». Sans ce préchargement, l'image (~700 Ko) ne commençait à se
         télécharger qu'une fois tout le bundle JS téléchargé ET exécuté, les deux téléchargements
         s'enchaînant au lieu de se chevaucher. Présent sur toutes les pages (ce fichier est le
         même pour toute l'application) : un coût négligeable sur les autres pages une fois
         l'image en cache, pour un gain net sur celle qui compte le plus, la vitrine publique. -->
    <link rel="preload" as="image" href="/hero-hoc.webp" fetchpriority="high" type="image/webp" />
    <title>Hari Online Club</title>
    <meta
      name="description"
      content="Hari Online Club : cours de langues en visio avec un professeur attitré, en individuel, en duo ou en petit groupe."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
